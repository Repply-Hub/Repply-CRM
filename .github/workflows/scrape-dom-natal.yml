name: Scrape DOM Natal

on:
  schedule:
    # Segunda a sexta às 09:00 UTC (06:00 BRT)
    - cron: '0 9 * * 1-5'
  workflow_dispatch:
    inputs:
      mes:
        description: 'Mês (1-12). Padrão: mês atual'
        required: false
        type: string
      ano:
        description: 'Ano (ex: 2026). Padrão: ano atual'
        required: false
        type: string
      meses_atras:
        description: 'Quantos meses anteriores também processar'
        required: false
        default: '1'
        type: string

jobs:
  scrape:
    name: Scrape e importar licenças
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install requests pdfplumber supabase

      - name: Executar scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.mes }}" ]; then
            ARGS="$ARGS --mes ${{ inputs.mes }}"
          fi
          if [ -n "${{ inputs.ano }}" ]; then
            ARGS="$ARGS --ano ${{ inputs.ano }}"
          fi
          MESES_ATRAS="${{ inputs.meses_atras }}"
          ARGS="$ARGS --meses-atras ${MESES_ATRAS:-1}"
          python scripts/dom_natal_scraper.py $ARGS
