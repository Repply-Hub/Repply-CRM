# O Stripe chama este endpoint sem JWT do Supabase: a autenticidade vem da
# assinatura no header stripe-signature, conferida dentro da função.
# stripe-checkout e stripe-portal NÃO entram aqui — exigem sessão do usuário.
[functions.stripe-webhook]
verify_jwt = false

# Retorno do OAuth do Nylas: é o NAVEGADOR voltando do provedor, sem JWT do
# Supabase. A autenticidade vem do `state` de uso único, gerado em
# email-conectar e consumido aqui.
[functions.email-callback]
verify_jwt = false

# O Nylas chama sem JWT; a autenticidade vem do HMAC em x-nylas-signature,
# conferido sobre o corpo cru dentro da função.
[functions.email-webhook]
verify_jwt = false

# Atende dois chamadores com credenciais diferentes: o pg_cron com service_role
# e o navegador com JWT de usuário. A distinção é feita dentro da função, que
# recusa quem não apresentar nenhuma das duas.
[functions.email-sync]
verify_jwt = false

