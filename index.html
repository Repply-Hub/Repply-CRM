<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Repply</title>
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo-dark.svg" />
    <meta
      name="description"
      content="o CRM para representantes comerciais. Pipeline de vendas, controle de carteira e dashboards, tudo em um só lugar."
    />
    <meta name="author" content="Repply" />
    <!-- O canonical apontava para o domínio de preview do Lovable, com o nome
         antigo do produto. Enquanto "/" era rota protegida isso não tinha efeito;
         agora que é uma landing pública, declarar o domínio errado faria os
         buscadores consolidarem o ranqueamento fora do site real. Sem a tag, cada
         página é canônica de si mesma — restaurar só quando o domínio definitivo
         estiver definido. -->

    <meta property="og:type" content="website" />
    <!-- 🔴 A CAPA DOS LINKS COMPARTILHADOS. Até 31/08/2026 estas duas etiquetas apontavam para
         a logo da MD REPRESENTAÇÕES, hospedada num balde da agência que fez o projeto: todo
         link do produto colado no WhatsApp, no LinkedIn ou num e-mail aparecia com a marca de
         um CLIENTE como capa. Agora é a wordmark da Repply, 1200x630 (o formato que as redes
         esperam), servida do próprio domínio — sem depender de um balde de terceiro que pode
         sumir. O arquivo vive em `public/og-repply.png`.
         O endereço é absoluto de propósito: leitor de rede social não resolve caminho
         relativo. -->
    <meta
      property="og:image"
      content="https://crm.repplyhub.com.br/og-repply.png"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://crm.repplyhub.com.br/og-repply.png"
    />

    <!-- Fonts: General Sans (display) + Satoshi (body) + JetBrains Mono (data) -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&f[]=satoshi@400,500,700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <meta property="og:title" content="Repply - o CRM que fala a sua língua" />
    <meta name="twitter:title" content="Repply - o CRM que fala a sua língua" />
    <meta
      property="og:description"
      content="o CRM para representantes comerciais. Pipeline de vendas, controle de carteira e dashboards, tudo em um só lugar."
    />
    <meta
      name="twitter:description"
      content="o CRM para representantes comerciais. Pipeline de vendas, controle de carteira e dashboards, tudo em um só lugar."
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
